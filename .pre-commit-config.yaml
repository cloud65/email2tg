#exclude: '^.*/alembic/.*'
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: python
        types: [ python ]
        args:
          - "--line-length=128"
          - "--skip-magic-trailing-comma"

  - repo: https://github.com/myint/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        name: autoflake
        entry: autoflake
        language: python
        types: [ python ]
        args: [ --in-place, --remove-all-unused-imports, --remove-duplicate-keys ]

  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        language: python
        types: [ python ]
        args:
          - "--select=WPS"
          - "--ignore=E203,W503,FI10,FI11,FI12,FI13,FI14,FI15,FI16,FI17,FI58,PT013,WPS115,WPS201,WPS202,WPS204,WPS210,WPS213,WPS214,WPS217,WPS220,WPS221,WPS226,WPS229,WPS237,WPS404,WPS411,WPS421,WPS432,WPS457,WPS463,WPS601,WPS615"
          - "--max-line-length=128"
          - '--exclude=*/tests/*'

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        name: isort
        entry: isort
        language: python
        types: [ python ]
        args: ["--profile=black", "--line-length=128"]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        types: [ python ]
        args:
          - "--line-length=128"

